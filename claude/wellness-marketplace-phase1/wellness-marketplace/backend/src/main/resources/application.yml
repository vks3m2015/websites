server:
  port: 8080

spring:
  application:
    name: wellness-platform
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/wellness}
    username: ${DATABASE_USERNAME:wellness}
    password: ${DATABASE_PASSWORD:wellness}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-dev-only-change-me-32b}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 7
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

logging:
  level:
    com.wellness.platform: INFO
