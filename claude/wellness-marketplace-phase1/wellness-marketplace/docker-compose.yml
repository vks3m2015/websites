version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: wellness-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: wellness
      POSTGRES_USER: wellness
      POSTGRES_PASSWORD: wellness
    ports:
      - "5433:5432"
    volumes:
      - wellness_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wellness -d wellness"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: wellness-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/wellness
      DATABASE_USERNAME: wellness
      DATABASE_PASSWORD: wellness
      JWT_SECRET: local-dev-secret-please-change-32bytes-min
      CORS_ALLOWED_ORIGINS: http://localhost:3001
    ports:
      - "8081:8080"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8081
    container_name: wellness-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3001:3000"

volumes:
  wellness_pgdata:
